# CI web d'Evora pour le fork tazerty/evolight (futur moteur d'Evora Revela).
#
# Écrite par Evora à partir de packaging/web/package.sh, packaging/env.sh, xtask/src/web.rs et
# docs/web.md de l'amont (MIT OR Apache-2.0). Rien n'est repris de amont/evo-common-actions.
# Règles : aucune action tierce (seulement actions/checkout, actions/cache et ses sous-actions restore
# et save, actions/upload-artifact, épinglées par SHA complet), toolchain Rust installée par rustup à version exacte, outils de build
# installés à version exacte (cargo install --locked), permissions en lecture seule, aucun secret.
#
# Sortie : artefact Actions « evora-revela-web-<tag> » contenant evora-revela-web-<tag>.zip,
# csp-hashes.txt, SHA256SUMS et BUILD-INFO.txt (le zip porte le site, ses copies .gz/.br et LICENSES/).
# Le nom Evora n'est pris qu'une fois E1 posé et toutes les portes au vert (run 38369456468, EVORA-REV-05).
#
# Portes (ARCHITECTURE §3.4), toutes BLOQUANTES depuis E1 : chaque porte tourne même si une autre a
# échoué (continue-on-error), et l'étape « Verdict des portes » fait échouer le job si une seule est
# rouge ; l'archive n'est déposée qu'au vert. Les instruments maison (.github/evora/*.mjs) prouvent
# d'abord qu'ils savent rougir (auto-tests sur paquets piégés, témoin vert), et le test de fumée est
# saboté une fois par exécution.
#
# Pont EHP (E4, avec le correctif E5) : le test de fumée joue « pont-ehp » (coquille minimale d'une
# autre origine, evora-host.json admis écrit par le banc, messages de version 2, d'une origine non
# admise et d'une autre fenêtre sans réponse, stockage amorcé puis purgé au démarrage, ouverture d'une
# photo reçue en octets, langue et thème à chaud, purges current et all vérifiées au moment de
# l'accusé, aucune écriture en séance ni après purge), « pont-muet » (evora-host.json de l'artefact,
# vide) et « hors-pont » (comportement amont, ?storageNs= ignoré). Le même banc est rejoué à chaque
# exécution contre des moteurs factices (.github/evora/ehp-bench.mjs) et contre le vrai moteur sabordé
# (effacements sans effet dans sa page) : le conforme doit rester vert et chaque défaut doit rougir
# avec son étiquette, sinon le job est rouge.
#
# Pont d'enregistrement de Revela (EVORA-REV-29, banc EVORA-REV-30) : « pont-ehp » exerce aussi les
# documents de la coquille (un docRef par photo, evora:dirty, evora:active, evora:activate), la
# machine d'enregistrement (enveloppe revela-save, evora:saved refusé, photo changée pendant l'envoi,
# « clean »), revela.apply par réglages et par sidecar XMP, la liste blanche des commandes, l'export
# de deux photos vers Drive (docRef de chaque fichier, aucun téléchargement), le sélecteur d'Evora,
# F6 (evora:focus-out) et Ctrl+S ; dix moteurs factices de plus portent chacun un de ces défauts.
#
# Finitions du moteur (EVORA-REV-33, banc EVORA-REV-34, lot REV-FK-B2) : « pont-ehp » juge aussi, au
# rendu, les menus masqués sous le pont (web.menus), le nom affiché (« Revela », jamais « EvoLight »,
# terme bloquant des portes E9 et du rendu), l'accent reçu de la coquille, les types du sélecteur
# d'Evora et le catalogue des commandes (command.catalog) ; le catalogue reçu est déposé dans
# l'artefact (commands.json, empreinte dans SHA256SUMS). La porte de taille du .wasm lit le budget
# EVORA_WASM_BUDGET_BYTES (variable du dépôt de CI) en mode rapport (DT-S20 d'Evora : mesure consignée).
# EVORA-REV-38 (correction 1 du lot) : le catalogue est jugé contre le schéma fermé de la coquille
# d'Evora et son empreinte recalculée ; les schémas des paramètres déclarés sont déposés à part
# (command-params.json, empreinte dans SHA256SUMS), sous la forme des commandes d'engines.json.
#
# Porte « horloge » (EVORA-REV-72, exception L4-REV-H) : aucune lecture d'horloge de std
# (Instant::now, SystemTime::now) compilée pour wasm32 dans les crates locales du build web hors de la
# liste blanche justifiée de .github/evora/clock-guards.py (sites gardés par profiling(), par une garde
# d'exécution ou réservés à l'application de bureau) ; le graphe qu'elle lit est contre-éprouvé par
# la sortie de cargo tree de la porte E7. C'est une telle lecture qui empêchait la v0.19.0 d'ouvrir
# un RAW (EVORA-REV-71). Depuis EVORA-REV-74, chaque entrée de la liste est liée à sa garde (jeton
# exigé avant le site ou dans la fonction qui la porte, empreinte du corps de la fonction englobante) :
# une garde retirée ou une fonction admise retouchée rougit la porte et force sa relecture.
#
# Témoin RAW (EVORA-REV-73) : le test de fumée joue « raw-dng » : la coquille ouvre par evora:open le DNG
# SYNTHÉTIQUE versionné (.github/evora/fixtures/temoin-rggb.dng : mosaïque RGGB calculée en entiers par
# fixtures/temoin-dng.py, aucune photo), attend son premier rendu, l'exporte (evora:export), décode le
# fichier reçu et rougit sur un export vide, indécodable ou uniforme, et sur toute panique du module
# (« panicked at », « RuntimeError: unreachable », worker de rendu arrêté, cible plantée). L'auto-test
# vérifie que le DNG versionné est exactement celui du script ; les témoins sabordent trois fois le vrai
# moteur (export uniforme, export vide, panique) : chaque sabordage doit rougir avec son étiquette.
#
# Empreintes figées (lot 1 « REV-TONS », P0, EVORA-REV-75 ; élargies par EVORA-REV-95) : avant la
# version du rendu d'Evora, le test ignoré tests_frozen::print_frozen_render_fingerprints du pipeline,
# joué en natif (cible de l'hôte, dossier target à part), imprime l'empreinte des rendus de V1 à V6 :
# dix-huit couples de source et de jeu de réglages (fichier rendu et brut de test, huit jeux chacun ;
# brut à courbe d'appareil, deux jeux), six versions, crans −1 à +2, soit 432 lignes. Ses lignes vont
# au résumé et aux diagnostics. Celles du run 43281819468, relevées sur l'arbre d'EVORA-REV-95, sont
# les constantes du test R11 (crates/pipeline/src/frozen_renders.txt, EVORA-REV-96), qui garde ces
# rendus figés pendant et après l'arrivée de la version du rendu d'Evora. Depuis EVORA-REV-97 (repris
# d'EVORA-REV-82 et -84 du lot 1), l'étape ne relève que sur un arbre qui ne connaît pas Evora1, avec
# la ligne frozen-commit du relevé ; ailleurs, ses lignes sont titrées « controle » et ne se recopient
# pas. La porte tests Rust vérifie le commit inscrit dans le fichier des constantes (ancêtre de la
# tête, arbre sans Evora1 ni dossier crates/pipeline/src/evora1, recette qui y annonce autant de cas
# que le fichier a d'empreintes) et le dernier commit à avoir touché ce fichier (arbre sans Evora1 non
# plus : rien n'y est écrit après l'arrivée de cette version). Elle ne prouve pas que les lignes sont
# celles du run du commit inscrit : cela se relit contre l'artefact de ce run. Elle pose
# EVORA_FROZEN_STRICT=1, sous laquelle R11 échoue sur un écart de plateforme.
#
# Porte tests Rust (EVORA-REV-97 ; juge, étapes et corrections repris du lot 1, EVORA-REV-78, -82, -83
# et -87) : avant le build web, cargo test en natif sur tous les tests du schéma des réglages et du
# pipeline (dont R11 et ses 432 empreintes), la validation des modules WGSL sans GPU, un test du
# catalogue, puis l'accord des deux chemins (calcul principal et noyau graphique) sur lavapipe,
# l'adaptateur Vulkan logiciel de Mesa, admis par EVOLIGHT_GPU_ALLOW_SOFTWARE=1 pour les tests
# seulement. Une sonde doit trouver l'adaptateur, et son témoin sans la variable doit le refuser.
# .github/evora/test-guards.py (repris du lot 1 octet pour octet) juge les journaux contre la liste
# fermée .github/evora/expected-tests.txt : rouge si un test attendu n'a pas tourné, est ignoré, en
# échec ou sauté (EVOLIGHT_SKIP_LOG), sur tout saut GPU de l'accord, et sur tout test en échec, même
# hors liste. Le juge ne rougit que sur les tests inscrits : le nombre de lignes de la liste est donc
# fixé dans l'étape (EXPECTED_TESTS, à monter par chaque commit qui inscrit un test), et la ligne de
# R11 y est exigée. Un test hors liste qui passe ou qui est ignoré n'est pas jugé. Sans lavapipe
# (installation en échec, qui n'arrête pas la tâche), la sonde le dit et seule cette porte rougit.
# Elle tourne comme les autres portes avec continue-on-error : un rouge ne saute ni le
# build ni la fumée, ses journaux vont aux diagnostics et le verdict la nomme ; son dossier target
# est réenregistré à chaque run, même rouge. La sonde, son témoin et les quatre courses vont au bout
# même quand l'une échoue (une sonde qui ne compile pas ne saute pas les tests du pipeline), le juge
# et la ligne de bilan des codes s'impriment toujours, et la ligne frozen-commit se lit comme R11 la
# lit (dernière ligne sans fin de ligne, fins CRLF).
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tag amont épinglé et son commit (D-19) ; la branche doit s'appeler evora/<UPSTREAM_TAG>.
  UPSTREAM_TAG: v0.19.0
  UPSTREAM_COMMIT: 16636c45a63bff3065a6fd31aecc22a6fc15ca53
  # Aucun rust-toolchain(.toml) dans le dépôt : version stable exacte, celle du job « Web (wasm) »
  # réussi de la release amont v0.19.0 (run 42280437097, job 128108175534, rustc 1.99.1), conforme au README amont
  # (Rust >= 1.95) et au rust-version du Cargo.toml (1.95).
  RUST_VERSION: "1.99.1"
  # Doit être égal à la version de wasm-bindgen dans Cargo.lock (cargo xtask web le vérifie).
  WASM_BINDGEN_VERSION: "0.2.129"
  # tazerty/evo-fonts, copie de la révision du release.yml amont (« bump deliberately ») ; depuis
  # v0.9.1, crates/engine/build.rs exige Noto Sans Thai Regular quand EVO_FONTS_REQUIRED est posé,
  # et depuis v0.14.0 le module web embarque aussi Noto Sans Georgian (présente à cette révision).
  # v0.19.0 : la release amont prend une révision plus récente des polices (b076417), dont
  # tazerty/evo-fonts n'a pas de copie ; elle n'ajoute que des faces au manifeste (Devanagari,
  # Hebrew, Symbols, Symbols 2, NanumGothic) que le module web n'embarque pas (build.rs : seulement
  # BIZ UDPGothic, Noto Sans Thai, Noto Sans Georgian sur wasm32), et les lignes du manifeste de ces
  # trois faces et de la face chinoise servie à part sont identiques à l'octet : la copie de a71c20e
  # est gardée.
  EVO_FONTS_REV: 694feb975e8c85807341856d54c4973949dac49e
  # Outils des portes : binaires officiels épinglés par version ET par empreinte (digest publié par
  # GitHub pour l'asset de la release, relu le 2026-10-13).
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_ABOUT_VERSION: "0.9.2"
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  web:
    name: Web (wasm) Evora
    # Image épinglée : le libellé ubuntu-latest bascule vers Ubuntu 26 à partir du 2026-10-19
    # (avis de GitHub dans les journaux) ; Chrome et Node du test de fumée viennent de cette image.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        # Shell explicite : « bash --noprofile --norc -eo pipefail {0} » (le défaut implicite est « bash -e », sans pipefail).
        shell: bash
    steps:
      - name: Récupération du fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Récupération de evo-fonts (révision épinglée)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tazerty/evo-fonts
          ref: ${{ env.EVO_FONTS_REV }}
          path: evo-fonts
          persist-credentials: false

      - name: Contrôle de la branche, du tag et du commit amont
        id: meta
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            evora/*) ;;
            *) echo "::error::branche $GITHUB_REF_NAME hors du motif evora/<tag>"; exit 1 ;;
          esac
          TAG="${GITHUB_REF_NAME#evora/}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag « $TAG » invalide"; exit 1
          fi
          if [ "$TAG" != "$UPSTREAM_TAG" ]; then
            echo "::error::la branche vise $TAG mais UPSTREAM_TAG vaut $UPSTREAM_TAG : mettre le workflow à jour"; exit 1
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD; then
            echo "::error::$UPSTREAM_COMMIT (tag $UPSTREAM_TAG) n'est pas un ancêtre de HEAD"; exit 1
          fi
          VERSION="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml annonce $VERSION, incompatible avec le tag $TAG"; exit 1
          fi
          LOCKED_WB="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          if [ "$LOCKED_WB" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock fixe wasm-bindgen $LOCKED_WB, le workflow $WASM_BINDGEN_VERSION"; exit 1
          fi
          EVORA_COMMITS="$(git rev-list --count "$UPSTREAM_COMMIT..HEAD")"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "evora_commits=$EVORA_COMMITS"
          } >> "$GITHUB_OUTPUT"
          echo "branche $GITHUB_REF_NAME, tag $TAG ($UPSTREAM_COMMIT), version $VERSION, $EVORA_COMMITS commit(s) Evora"

      - name: Installation de Rust (rustup, version exacte)
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Cache du registre Cargo et des outils
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.evora-tools
          key: evora-web-cargo-${{ runner.os }}-rust${{ env.RUST_VERSION }}-wb${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-cargo-${{ runner.os }}-rust${{ env.RUST_VERSION }}-wb${{ env.WASM_BINDGEN_VERSION }}-

      - name: Cache du dossier target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: evora-web-target-${{ runner.os }}-rust${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-target-${{ runner.os }}-rust${{ env.RUST_VERSION }}-

      - name: Restauration du dossier target des tests natifs (empreintes figées, porte tests Rust)
        id: tests_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Dossier à part, hors du dépôt : la clé du cache target du build web est trouvée exactement à
          # chaque run, donc ce cache n'est jamais réenregistré ; des artefacts natifs n'y seraient pas gardés.
          # EVORA-REV-97 (repris d'EVORA-REV-83 du lot 1) : clé par exécution, restauration par préfixe ;
          # l'enregistrement est une étape à part, juste après la porte tests Rust, jouée même quand elle
          # est rouge (une clé fixe trouvée exactement n'aurait jamais été réenregistrée : le cache posé
          # par l'étape des empreintes n'aurait jamais reçu les binaires de la porte).
          # Deux dossiers target sont en cache : surveiller le quota de cache du dépôt.
          path: ~/.evora-target-tests
          key: evora-tests-target-${{ runner.os }}-rust${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            evora-tests-target-${{ runner.os }}-rust${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-
            evora-tests-target-${{ runner.os }}-rust${{ env.RUST_VERSION }}-

      - name: Installation de wasm-bindgen-cli (version exacte)
        run: |
          set -euo pipefail
          TOOLS="$HOME/.evora-tools"
          have="$("$TOOLS/bin/wasm-bindgen" --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" != "$WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "=$WASM_BINDGEN_VERSION" --locked --root "$TOOLS" --force
          fi
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          "$TOOLS/bin/wasm-bindgen" --version

      - name: Installation de cargo-deny et cargo-about (binaires épinglés, empreintes vérifiées)
        env:
          # EVORA-REV-54 : repli par l'API des releases (gh) quand le lien de téléchargement rend 504 depuis les runners
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/evora-bin"; mkdir -p "$BIN"
          fetch() { # $1 dépôt, $2 nom, $3 version, $4 sha256 de l'archive
            local tgz="$2-$3-x86_64-unknown-linux-musl.tar.gz" dir="$RUNNER_TEMP/evora-tools-$2"
            # lien direct (reprises espacées), sinon la même archive par l'API des releases ; l'empreinte fait foi dans les deux cas
            if ! curl -fsSL --retry 5 --retry-delay 15 -o "$RUNNER_TEMP/$tgz" "https://github.com/$1/releases/download/$3/$tgz"; then
              echo "::warning::$tgz : lien direct en échec, repli par l'API des releases"
              rm -f "$RUNNER_TEMP/$tgz"
              gh release download "$3" --repo "$1" --pattern "$tgz" --dir "$RUNNER_TEMP"
            fi
            echo "$4  $RUNNER_TEMP/$tgz" | sha256sum -c -
            mkdir -p "$dir"
            tar -xzf "$RUNNER_TEMP/$tgz" -C "$dir"
            local exe
            exe="$(find "$dir" -type f -name "$2" | head -n 1)"
            [ -n "$exe" ] || { echo "::error::$2 introuvable dans $tgz"; exit 1; }
            install -m 0755 "$exe" "$BIN/$2"
            "$BIN/$2" --version | tee /dev/stderr | grep -qF "$3" || { echo "::error::$2 n'annonce pas la version $3"; exit 1; }
          }
          fetch EmbarkStudios/cargo-deny cargo-deny "$CARGO_DENY_VERSION" "$CARGO_DENY_SHA256"
          fetch EmbarkStudios/cargo-about cargo-about "$CARGO_ABOUT_VERSION" "$CARGO_ABOUT_SHA256"
          echo "$BIN" >> "$GITHUB_PATH"
          node --version

      - name: Installation de lavapipe (Vulkan logiciel de Mesa, pour l'accord des deux chemins)
        # Seule la porte tests Rust en dépend : un miroir apt en panne ne doit sauter ni les autres portes
        # ni le build. Sans lavapipe, la sonde dit « available: false » et la porte rougit, avec son étiquette.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Aucun GPU sur le runner : lavapipe est le seul adaptateur, admis pour les tests seulement par
          # EVOLIGHT_GPU_ALLOW_SOFTWARE=1 (crates/gpu/src/ctx.rs ; l'application ne le pose jamais).
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1
          dpkg-query -W -f='${Package} ${Version}\n' mesa-vulkan-drivers libvulkan1 | tee "$RUNNER_TEMP/lavapipe.txt"

      - name: Auto-tests des instruments de porte (chaque porte doit savoir rougir)
        run: |
          set -euo pipefail
          node .github/evora/bundle-gates.mjs selftest
          node .github/evora/catalog-audit.mjs --selftest
          node .github/evora/advisory-guards.mjs --selftest
          node .github/evora/feature-guards.mjs --selftest
          python3 .github/evora/clock-guards.py selftest
          python3 .github/evora/test-guards.py selftest
          python3 .github/evora/fixtures/temoin-dng.py check .github/evora/fixtures/temoin-rggb.dng

      - name: Portes E10 et E9 — émojis et termes sensibles des catalogues affichés
        id: g_emoji
        continue-on-error: true
        run: node .github/evora/catalog-audit.mjs . --rust-blocking --terms-blocking --summary "$GITHUB_STEP_SUMMARY"

      - name: Porte cargo-deny — licences, avis de sécurité, sources
        id: g_deny
        continue-on-error: true
        run: |
          set -euo pipefail
          # Les avis ignorés dans deny.toml ne le sont qu'à la condition revérifiée ici.
          node .github/evora/advisory-guards.mjs .
          cargo deny --manifest-path apps/evolight-web/Cargo.toml --config .github/evora/deny.toml --locked --color never \
            check --show-stats advisories licenses sources 2>&1 | tee "$RUNNER_TEMP/cargo-deny.txt"

      - name: Porte E7 — neutralisations du graphe web (HEIF, SAM 3, débruitage IA, RawNIND)
        id: g_e7
        continue-on-error: true
        run: |
          set -euo pipefail
          # Résolution des features du seul paquet web pour la cible du navigateur, comme le build.
          cargo tree -p evolight-web --target wasm32-unknown-unknown -e normal,features --prefix none --locked > "$RUNNER_TEMP/web-tree.txt"
          node .github/evora/feature-guards.mjs "$RUNNER_TEMP/web-tree.txt"

      - name: Porte horloge — aucune lecture d'horloge de std sans garde dans le build web (L4-REV-H)
        id: g_clock
        continue-on-error: true
        run: |
          set -euo pipefail
          # Graphe lu depuis les Cargo.toml, contre-éprouvé par la sortie de cargo tree de la porte E7.
          python3 .github/evora/clock-guards.py check . --tree "$RUNNER_TEMP/web-tree.txt"

      - name: Empreintes figées des rendus V1 à V6 (lot 1, P0, recette « éditions figées » ; relevé sur un arbre sans Evora1, contrôle ensuite)
        id: g_frozen
        continue-on-error: true
        run: |
          set -euo pipefail
          # Build natif à part (cible de l'hôte) : le dossier target du build web n'est pas touché.
          export CARGO_TARGET_DIR="$HOME/.evora-target-tests"
          OUT="$RUNNER_TEMP/evora-diag/empreintes-figees"; mkdir -p "$OUT"
          rustc --version --verbose | tee "$OUT/plateforme.txt"
          # Ce qui fixe le dernier bit des empreintes au-delà de « linux x86_64 » : la libc (et
          # sa libm) et le processeur du runner. Relevés pour le diagnostic seulement.
          { getconf GNU_LIBC_VERSION || true; grep -m1 '^model name' /proc/cpuinfo || true; } | tee -a "$OUT/plateforme.txt"
          cargo test --locked -p evolight-pipeline --lib -- --ignored --exact tests_frozen::print_frozen_render_fingerprints --nocapture \
            2>&1 | tee "$OUT/journal.txt"
          sed 's/\x1b\[[0-9;]*m//g' "$OUT/journal.txt" | grep -E '^frozen(-platform| v)' > "$OUT/releve.txt" || true
          total="$(sed 's/\x1b\[[0-9;]*m//g' "$OUT/journal.txt" | sed -n 's/^frozen-total //p')"
          lignes="$(grep -c '^frozen v' "$OUT/releve.txt" || true)"
          if [ -z "$total" ] || [ "$lignes" != "$total" ]; then
            echo "::error::empreintes figées : $lignes ligne(s) relevée(s) pour un total annoncé de « $total »"; exit 1
          fi
          # Sans ligne frozen-platform, grep rend 1 : sous pipefail l'étape s'arrêterait ici sans rien dire.
          plateforme="$(grep '^frozen-platform' "$OUT/releve.txt" | cut -d' ' -f2- || true)"
          if [ -z "$plateforme" ]; then
            echo "::error::empreintes figées : ligne frozen-platform absente du relevé"; exit 1
          fi
          # EVORA-REV-97 (repris d'EVORA-REV-82 du lot 1) : seul un arbre qui ne connaît pas la version du
          # rendu d'Evora relève les constantes de R11, avec la ligne de provenance frozen-commit. Sur un
          # arbre qui la connaît, les mêmes lignes sont titrées « controle » : R11 refuse de les lire, elles
          # ne se recopient pas. Un fichier des réglages absent est une erreur (grep rendrait 2, lu comme
          # « ne connaît pas » ; EVORA-REV-84 du lot 1).
          SETTINGS=crates/develop/src/settings.rs
          [ -f "$SETTINGS" ] || { echo "::error::$SETTINGS absent : impossible de dire si l'arbre connaît Evora1"; exit 1; }
          if grep -qw 'Evora1' "$SETTINGS"; then
            sed 's/^frozen/controle/' "$OUT/releve.txt" > "$OUT/controle.txt"
            {
              echo "### Empreintes de V1 à V6 sur un arbre qui connaît Evora1 : contrôle seulement, NE PAS RECOPIER"
              echo
              echo "$lignes empreintes, $plateforme ; $(rustc --version). Les constantes de R11 viennent du relevé sur un arbre d'avant cette version"
              echo "(ligne frozen-commit de crates/pipeline/src/frozen_renders.txt, vérifiée par la porte tests Rust)."
              echo
              echo '```'
              cat "$OUT/controle.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            { cat "$OUT/releve.txt"; echo "frozen-commit $GITHUB_SHA"; } > "$OUT/frozen_renders.txt"
            {
              echo "### Empreintes figées des rendus V1 à V6 (P0 du lot 1) : relevé sur un arbre qui ne connaît pas Evora1"
              echo
              echo "$lignes empreintes, $plateforme ; $(rustc --version) ; commit $GITHUB_SHA."
              echo "Les constantes de R11 sont déjà dans crates/pipeline/src/frozen_renders.txt, et R11 leur confronte ces rendus."
              echo "Ces lignes ne s'y recopient, telles quelles et ligne frozen-commit comprise, que pour un relevé neuf (cas ajouté à la recette)."
              echo
              echo '```'
              cat "$OUT/frozen_renders.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Porte tests Rust — schéma des réglages, pipeline, catalogue, accord des deux chemins sur lavapipe (liste fermée, aucun saut)
        id: g_tests
        # Comme les autres portes, elle ne saute pas les suivantes ; TESTS est au verdict
        continue-on-error: true
        timeout-minutes: 45 # garde technique [P], à réviser sur la mesure du premier run
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$HOME/.evora-target-tests"
          OUT="$RUNNER_TEMP/evora-diag/tests"; mkdir -p "$OUT"
          rustc --version --verbose | tee "$OUT/plateforme.txt"
          # L'installation de lavapipe n'arrête pas la tâche : sans elle, la sonde tranche plus bas.
          if [ -s "$RUNNER_TEMP/lavapipe.txt" ]; then
            cat "$RUNNER_TEMP/lavapipe.txt" >> "$OUT/plateforme.txt"
          else
            echo "::warning::lavapipe : paquets non relevés (étape d'installation en échec) ; la sonde dira si l'adaptateur est là"
            echo "lavapipe : paquets non relevés (étape d'installation en échec)" >> "$OUT/plateforme.txt"
          fi
          # 0. Provenance des constantes de R11 (repris d'EVORA-REV-82 du lot 1, resserré ici). Ce que la
          #    porte prouve :
          #    a. le commit inscrit (ligne frozen-commit) est un ancêtre de la tête, et son arbre ne
          #       connaît pas la version du rendu d'Evora (ni le dossier de son rendu, ni la variante
          #       Evora1 du schéma des réglages) ;
          #    b. à ce commit, la recette annonce (FROZEN_TOTAL) autant de cas que le fichier a
          #       d'empreintes : un ancêtre d'avant la recette, ou d'une recette plus courte, est refusé ;
          #    c. le dernier commit à avoir touché le fichier ne connaît pas cette version non plus :
          #       rien n'y a été écrit après son arrivée. Les lignes « controle », les seules que l'étape
          #       des empreintes imprime alors, n'ont donc pas pu y être recopiées : R11 ne confronte
          #       pas l'arbre à lui-même. En contrepartie, une fois cette version arrivée, le fichier
          #       ne se retouche plus, en-tête compris.
          #    Ce qu'elle ne prouve pas : que les lignes sont, octet pour octet, celles du run du commit
          #    inscrit. Cela se contrôle à la relecture (le fichier contre l'artefact de ce run) et, tant
          #    que l'arbre ne connaît pas cette version, par R11 joué dans la même exécution que le relevé.
          #    Les contrôles sont des conditions (aucun tube).
          PROV=0
          FROZEN_FILE=crates/pipeline/src/frozen_renders.txt
          FROZEN_RECIPE=crates/pipeline/src/tests_frozen.rs
          SETTINGS=crates/develop/src/settings.rs
          EVORA_RENDER=crates/pipeline/src/evora1
          # Rend 1, et dit pourquoi, si l'arbre du commit $1 connaît la version du rendu d'Evora.
          # $2 : ce qu'est ce commit, pour le message ; $3 : nom de la copie de son settings.rs (diagnostics).
          sans_evora1() {
            if git cat-file -e "$1:$EVORA_RENDER" 2>/dev/null; then
              echo "::error::R11 : l'arbre du $2 ($1) contient $EVORA_RENDER : constantes écrites après l'arrivée du rendu d'Evora"; return 1
            fi
            if ! git show "$1:$SETTINGS" > "$OUT/$3" 2>/dev/null; then
              echo "::error::R11 : settings.rs illisible au $2 ($1)"; return 1
            fi
            if grep -qw 'Evora1' "$OUT/$3"; then
              echo "::error::R11 : l'arbre du $2 ($1) connaît Evora1 : constantes écrites après l'arrivée de cette version"; return 1
            fi
            return 0
          }
          sha=""; figees=0; total=""; dernier=""
          if [ -f "$FROZEN_FILE" ]; then
            # Lu comme R11 (str::lines, puis mots séparés par des blancs ; EVORA-REV-87 du lot 1) : une
            # dernière ligne sans fin de ligne compte, et le retour chariot d'une fin CRLF est retiré.
            # La première ligne frozen-commit fait foi (R11 en refuse une seconde) ; les lignes
            # d'empreintes sont celles dont le premier mot est « frozen ».
            while read -r first second _ || [ -n "${first:-}" ]; do
              first="${first%$'\r'}"; second="${second%$'\r'}"
              if [ "$first" = "frozen-commit" ] && [ -z "$sha" ]; then sha="$second"; fi
              if [ "$first" = "frozen" ]; then figees=$((figees + 1)); fi
            done < "$FROZEN_FILE"
          fi
          if [ ! -f "$FROZEN_FILE" ]; then
            echo "::error::R11 : $FROZEN_FILE absent"; PROV=1
          elif [ -z "$sha" ]; then
            echo "::error::R11 : aucune ligne frozen-commit dans $FROZEN_FILE (constantes non relevées par la CI)"; PROV=1
          elif ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "::error::R11 : commit du relevé « $sha » illisible ou absent du dépôt"; PROV=1
          elif ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::R11 : le commit du relevé $sha n'est pas un ancêtre de la tête"; PROV=1
          else
            # a. l'arbre du commit inscrit
            sans_evora1 "$sha" "commit du relevé" settings-du-releve.rs || PROV=1
            # b. la recette du commit inscrit (une seule ligne « const FROZEN_TOTAL: usize = N; » attendue)
            if git show "$sha:$FROZEN_RECIPE" > "$OUT/recette-du-releve.rs" 2>/dev/null; then
              total="$(sed -n 's/^const FROZEN_TOTAL: usize = \([0-9][0-9]*\);.*$/\1/p' "$OUT/recette-du-releve.rs")"
            fi
            if [ -z "$total" ] || [ "$total" != "$figees" ]; then
              echo "::error::R11 : au commit du relevé $sha, la recette annonce « $total » cas (FROZEN_TOTAL de $FROZEN_RECIPE) pour $figees empreinte(s) dans $FROZEN_FILE : ce commit n'a pas pu relever ces lignes"; PROV=1
            fi
            # c. le dernier commit à avoir touché le fichier des constantes
            dernier="$(git log -1 --format=%H -- "$FROZEN_FILE" || true)"
            if [ -z "$dernier" ]; then
              echo "::error::R11 : aucun commit de l'historique ne porte $FROZEN_FILE"; PROV=1
            else
              sans_evora1 "$dernier" "dernier commit à avoir touché $FROZEN_FILE" settings-du-dernier-commit.rs || PROV=1
            fi
          fi
          if [ "$PROV" -eq 0 ]; then verdict=conforme; else verdict=ROUGE; fi
          echo "provenance des constantes de R11 : commit du relevé ${sha:-absent}, $figees empreinte(s), recette du relevé : ${total:-non lue} cas, dernier commit du fichier : ${dernier:-non recherché}, $verdict" | tee "$OUT/provenance.txt"
          # 0 bis. Plancher de la liste fermée. Le juge ne rougit que sur les tests inscrits : une liste
          #    amputée, ou vidée, resterait verte. Le nombre de tests inscrits est donc fixé ici, et chaque
          #    commit qui inscrit un test monte EXPECTED_TESTS dans le même commit ; la ligne de R11 y est
          #    exigée telle quelle.
          LISTE=0
          EXPECTED_LIST=.github/evora/expected-tests.txt
          EXPECTED_TESTS=33
          inscrits="$(grep -Ecv '^[[:space:]]*(#|$)' "$EXPECTED_LIST" || true)"
          if [ "$inscrits" != "$EXPECTED_TESTS" ]; then
            echo "::error::liste fermée : « $inscrits » test(s) inscrit(s) dans $EXPECTED_LIST, $EXPECTED_TESTS attendu(s) (EXPECTED_TESTS de cette étape, à monter par le commit qui inscrit un test)"; LISTE=1
          fi
          if ! grep -Fxq 'cpu evolight_pipeline tests_frozen::frozen_renders_v1_to_v6' "$EXPECTED_LIST"; then
            echo "::error::liste fermée : R11 (cpu evolight_pipeline tests_frozen::frozen_renders_v1_to_v6) n'est pas inscrit dans $EXPECTED_LIST"; LISTE=1
          fi
          # La sonde, son témoin et les courses vont au bout quoi qu'il arrive (EVORA-REV-87 du lot 1). Une
          # sonde qui ne compile pas (binaire it du noyau graphique) ne saute pas les tests du pipeline ;
          # son code de sortie va au bilan, et le juge rapporte son journal.
          set +e
          # 1. Sonde : sans adaptateur, chaque test d'accord passerait sans rien comparer.
          EVOLIGHT_GPU_ALLOW_SOFTWARE=1 EVOLIGHT_GPU_BACKEND=vulkan \
            cargo test --locked -p evolight-gpu --test it -- --ignored --exact gpu_probe::gpu_probe --nocapture 2>&1 | tee "$OUT/sonde.txt"
          SONDE=${PIPESTATUS[0]}
          # Témoin : la même sonde, sans adaptateur logiciel admis, doit dire « available: false ».
          EVOLIGHT_GPU_BACKEND=vulkan \
            cargo test --locked -p evolight-gpu --test it -- --ignored --exact gpu_probe::gpu_probe --nocapture 2>&1 | tee "$OUT/sonde-sans-logiciel.txt"
          TEMOIN=${PIPESTATUS[0]}
          # 2. à 4. Les quatre courses vont au bout ; le juge vient après elles.
          # EVORA_FROZEN_STRICT=1 : sur le runner, R11 échoue sur un écart de plateforme au lieu d'imprimer seulement.
          # Si R11 rougit sans changement du rendu : comparer evora-diag/empreintes-figees/releve.txt de
          # la même exécution (relevé seul, par l'étape des empreintes, avec le même binaire de test) au
          # fichier des constantes. Différents : l'écart vient de la compilation ou de la plateforme
          # (image du runner, libc, processeur : plateforme.txt du même dossier), et un relevé
          # neuf le dit. Identiques : il vient de la course, où R11 tourne avec les autres tests
          # (regarder si seules des lignes « fenetre » bougent).
          EVORA_FROZEN_STRICT=1 EVOLIGHT_SKIP_LOG="$OUT/sauts-cpu.jsonl" \
            cargo test --locked --no-fail-fast -p evolight-develop -p evolight-pipeline --lib --tests 2>&1 | tee "$OUT/cpu.txt"
          CPU=${PIPESTATUS[0]}
          EVOLIGHT_SKIP_LOG="$OUT/sauts-gpulib.jsonl" \
            cargo test --locked --no-fail-fast -p evolight-gpu --lib -- ctx::tests::every_kernel_module_validates_without_a_gpu 2>&1 | tee "$OUT/gpulib.txt"
          GPULIB=${PIPESTATUS[0]}
          # Le test du catalogue sur la version du rendu d'une photo, seul (EVORA-REV-83 du lot 1).
          EVOLIGHT_SKIP_LOG="$OUT/sauts-catalogue.jsonl" \
            cargo test --locked --no-fail-fast -p evolight-catalog --lib -- --exact model::edited_tests::the_process_a_photo_renders_with_is_not_an_edit \
            2>&1 | tee "$OUT/catalogue.txt"
          CATALOGUE=${PIPESTATUS[0]}
          EVOLIGHT_GPU_ALLOW_SOFTWARE=1 EVOLIGHT_GPU_BACKEND=vulkan EVOLIGHT_SKIP_LOG="$OUT/sauts-gpu.jsonl" \
            cargo test --locked --no-fail-fast -p evolight-gpu --test it -- equivalence:: 2>&1 | tee "$OUT/gpu.txt"
          GPU=${PIPESTATUS[0]}
          set -e
          # 5. Liste fermée : chaque test attendu vert une fois dans son binaire, aucun ignoré, absent ou
          #    sauté, aucun saut GPU ; sonde « available: true », témoin « available: false ».
          #    Un juge rouge n'arrête pas le script avant la ligne de bilan des codes.
          touch "$OUT/sauts-cpu.jsonl" "$OUT/sauts-gpulib.jsonl" "$OUT/sauts-gpu.jsonl" "$OUT/sauts-catalogue.jsonl"
          JUGE=0
          python3 .github/evora/test-guards.py check --list "$EXPECTED_LIST" \
            --log cpu="$OUT/cpu.txt" --log gpulib="$OUT/gpulib.txt" --log gpu="$OUT/gpu.txt" --log catalogue="$OUT/catalogue.txt" \
            --skips cpu="$OUT/sauts-cpu.jsonl" --skips gpulib="$OUT/sauts-gpulib.jsonl" --skips gpu="$OUT/sauts-gpu.jsonl" \
            --skips catalogue="$OUT/sauts-catalogue.jsonl" \
            --gpu-log gpu --probe "$OUT/sonde.txt" --probe-off "$OUT/sonde-sans-logiciel.txt" \
            --summary "$GITHUB_STEP_SUMMARY" || JUGE=$?
          if [ "$SONDE" -ne 0 ] || [ "$TEMOIN" -ne 0 ] || [ "$CPU" -ne 0 ] || [ "$GPULIB" -ne 0 ] || [ "$GPU" -ne 0 ] || [ "$CATALOGUE" -ne 0 ] \
            || [ "$JUGE" -ne 0 ] || [ "$PROV" -ne 0 ] || [ "$LISTE" -ne 0 ]; then
            echo "::error::cargo test : sonde $SONDE, témoin $TEMOIN, schéma et pipeline $CPU, modules WGSL $GPULIB, accord des deux chemins $GPU, catalogue $CATALOGUE ; juge $JUGE ; provenance de R11 $verdict ; plancher de la liste fermée $LISTE (journaux dans les diagnostics)"; exit 1
          fi

      - name: Enregistrement du dossier target des tests natifs (même quand la porte tests Rust est rouge)
        if: ${{ !cancelled() && steps.tests_cache.outcome == 'success' && steps.tests_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.evora-target-tests
          key: ${{ steps.tests_cache.outputs.cache-primary-key }}

      - name: Porte cargo-about — LICENSES/ des crates tierces
        id: g_about
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo about generate --manifest-path apps/evolight-web/Cargo.toml --locked --fail \
            -c .github/evora/about.toml -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" .github/evora/about.hbs 2>&1 | tee "$RUNNER_TEMP/cargo-about.txt"
          test -s "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
          echo "THIRD-PARTY-LICENSES.txt : $(wc -c < "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt") octets, $(grep -c '^- ' "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt") lignes de liste"

      - name: Build web (cargo xtask web, profil web)
        env:
          EVO_FONTS_DIR: ${{ github.workspace }}/evo-fonts
          EVO_FONTS_REQUIRED: "1"
          EVOLIGHT_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export EVOLIGHT_BUILD_DATE="$(date -u +%Y-%m-%d)"
          # Le dossier du site est régénéré à chaque build : rien ne survit d'un cache précédent.
          if [ -e target/web-site ]; then mv target/web-site "$RUNNER_TEMP/web-site-from-cache"; fi
          wasm-bindgen --version
          cargo xtask web
          ls -la target/web-site

      - name: Empaquetage du site statique
        id: pkg
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          EVORA_COMMITS: ${{ steps.meta.outputs.evora_commits }}
        run: |
          set -euo pipefail
          SITE="target/web-site"
          NAME="evora-revela-web-$TAG"
          OUT="$GITHUB_WORKSPACE/dist/evora"
          WORK="$RUNNER_TEMP/evora-package"
          [ -f "$SITE/index.html" ] || { echo "::error::$SITE/index.html absent"; exit 1; }
          # Garde reprise de package.sh (#793) : aucun artefact Cargo dans le site.
          for d in deps build .fingerprint; do
            if [ -e "$SITE/$d" ]; then echo "::error::$SITE/$d présent : artefacts Cargo dans le site (#793)"; exit 1; fi
          done
          # Garde reprise de package.sh : URL relatives seulement (service sous un sous-chemin et en iframe).
          if grep -Eq '(src|href)="/[^/]' "$SITE/index.html"; then
            echo "::error::$SITE/index.html contient des URL absolues depuis la racine"; exit 1
          fi
          # Le site produit par xtask est plat, sauf snippets/ (EVORA-REV-70) : les modules JS que wasm-bindgen
          # extrait des crates (inline_js de la fourche d'eframe depuis v0.19.0), importés par evolight_web.js,
          # donc indispensables au démarrage. Tout autre sous-dossier, un lien symbolique, ou sous snippets/ autre
          # chose qu'un module .js régulier, signale un changement amont à relire.
          odd="$(find "$SITE" -mindepth 1 \( -type l \
            -o \( -type d ! -path "$SITE/snippets" ! -path "$SITE/snippets/*" \) \
            -o \( -path "$SITE/snippets/*" ! -type d ! \( -type f -name '*.js' \) \) \) -print)"
          if [ -n "$odd" ]; then echo "::error::structure inattendue dans $SITE :"; echo "$odd"; exit 1; fi
          mkdir -p "$WORK/$NAME/LICENSES" "$OUT"
          # Copie des fichiers réguliers du site (avec leurs copies .gz/.br produites par xtask), sans fichiers
          # cachés ni fichiers d'hébergement (ni _headers ni .htaccess ni HOSTING.md : Evora pose ses propres en-têtes).
          find "$SITE" -maxdepth 1 -type f ! -name '.*' ! -name '_headers' ! -name '*.conf' -exec cp {} "$WORK/$NAME/" \;
          # EVORA-REV-70 : modules de wasm-bindgen, avec leurs copies précompressées (xtask ne précompresse que
          # ses propres fichiers ; la porte du bundle exige .gz et .br fidèles pour tout .js servi).
          if [ -d "$SITE/snippets" ]; then
            cp -R "$SITE/snippets" "$WORK/$NAME/snippets"
            find "$WORK/$NAME/snippets" -type f -name '*.js' -print0 | LC_ALL=C sort -z |
              while IFS= read -r -d '' f; do
                gzip -9 -n -k "$f"
                brotli -q 11 -k "$f"
              done
            echo "Modules de wasm-bindgen livrés :"
            (cd "$WORK/$NAME" && find snippets -type f | LC_ALL=C sort | xargs -r ls -l)
          fi
          # Licences et mentions (logique copy_docs et copy_font_licences de packaging/env.sh, README exclu).
          for f in LICENSE LICENSE-MIT LICENSE-APACHE COPYRIGHT NOTICE assets/ATTRIBUTION.md; do
            if [ -f "$f" ]; then cp "$f" "$WORK/$NAME/LICENSES/"; fi
          done
          # E1 : mention en texte simple du projet d'origine, seulement dans LICENSES/ (licence de marque amont).
          cp packaging/evora/NOTICE-EVORA.txt "$WORK/$NAME/LICENSES/"
          # EVORA-REV-66 : Inter est embarquée dans le .wasm (theme.rs) ; copy_font_licences livre toujours
          # son OFL à côté de NOTICE (OFL-Inter.txt), comme NOTICE l'annonce.
          cp assets/fonts/OFL-Inter.txt "$WORK/$NAME/LICENSES/OFL-Inter.txt"
          for lic in evo-fonts/fonts/*/OFL.txt; do
            [ -f "$lic" ] || continue
            cp "$lic" "$WORK/$NAME/LICENSES/OFL-$(basename "$(dirname "$lic")").txt"
          done
          # Licences des crates tierces compilées dans le .wasm (porte cargo-about) ; absentes = porte rouge.
          if [ -s "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" ]; then
            cp "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" "$WORK/$NAME/LICENSES/"
          else
            echo "::warning::THIRD-PARTY-LICENSES.txt absent (porte cargo-about en échec)"
          fi
          # E4 : origines parentes admises par le pont EHP (?host=evora). Vide dans l'artefact : le
          # provisionnement d'Evora l'écrit depuis engines.json (HOST-PROTOCOL §2.3) ; vide, le pont reste muet.
          printf '{"parentOrigins": []}\n' > "$WORK/$NAME/evora-host.json"
          # Empreintes CSP des scripts inline, écrites dans le bundle avant l'archive (un problème relevé
          # ici est jugé par la porte du bundle, qui tourne quoi qu'il arrive).
          node .github/evora/bundle-gates.mjs csp "$WORK/$NAME" || echo "::warning::empreintes CSP : problème relevé, voir la porte du bundle"
          (cd "$WORK" && zip -qr9X "$OUT/$NAME.zip" "$NAME")
          cp "$WORK/$NAME/csp-hashes.txt" "$OUT/csp-hashes.txt"
          (cd "$OUT" && sha256sum "$NAME.zip" csp-hashes.txt > SHA256SUMS)
          WASM="$WORK/$NAME/evolight_web_bg.wasm"
          {
            echo "artefact: $NAME.zip"
            echo "fork: $GITHUB_REPOSITORY"
            echo "branche: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "tag amont: $UPSTREAM_TAG"
            echo "commit amont: $UPSTREAM_COMMIT"
            echo "commits Evora au-dessus du tag: $EVORA_COMMITS"
            echo "version Cargo: $VERSION"
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "wasm-bindgen: $(wasm-bindgen --version)"
            echo "evo-fonts: $EVO_FONTS_REV"
            echo "cargo-deny: $(cargo-deny --version) ; cargo-about: $(cargo-about --version)"
            echo "wasm-opt: $(command -v wasm-opt >/dev/null && wasm-opt --version || echo absent)"
            echo "image du runner: ${ImageOS:-?} ${ImageVersion:-?} ; node: $(node --version) ; chrome: $(google-chrome --version 2>/dev/null || echo absent)"
            echo "exécution: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (essai $GITHUB_RUN_ATTEMPT)"
            echo "date UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256 $NAME.zip: $(sha256sum "$OUT/$NAME.zip" | cut -d' ' -f1)"
            echo "sha256 evolight_web_bg.wasm: $(sha256sum "$WASM" | cut -d' ' -f1)"
          } > "$OUT/BUILD-INFO.txt"
          cat "$OUT/BUILD-INFO.txt" "$OUT/SHA256SUMS"
          ls -la "$OUT"
          {
            echo "name=$NAME"
            echo "zip=$OUT/$NAME.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Extraction de l'archive (les portes jugent l'artefact, pas le dossier de travail)
        id: unpacked
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/evora-verify"
          mkdir -p "$V" "$RUNNER_TEMP/evora-diag"
          unzip -q "$ZIP" -d "$V"
          echo "dir=$V/$NAME" >> "$GITHUB_OUTPUT"
          find "$V" -maxdepth 2 | sort | head -50

      - name: Portes du bundle — marques, hébergement, .gz/.br, CSP, taille
        id: g_bundle
        continue-on-error: true
        env:
          # DT-S20 d'Evora : budget du .wasm (D-15, « à arbitrer »), en mode rapport : un dépassement est
          # consigné au résumé sans faire rougir la porte (EVORA_WASM_BUDGET_MODE=bloquant le ferait).
          EVORA_WASM_BUDGET_BYTES: ${{ vars.EVORA_WASM_BUDGET_BYTES }}
          EVORA_WASM_BUDGET_MODE: rapport
        run: |
          node .github/evora/bundle-gates.mjs check "${{ steps.unpacked.outputs.dir }}" --zip "${{ steps.pkg.outputs.zip }}" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RUNNER_TEMP/evora-diag/bundle-gates.json"

      - name: Porte zéro terme — le nom amont retiré absent du site, hors LICENSES/
        id: g_term
        continue-on-error: true
        run: |
          python3 .github/evora/zero-terme.py selftest
          python3 .github/evora/zero-terme.py check "${{ steps.unpacked.outputs.dir }}"

      - name: Porte E6 — polices (evo-fonts épinglé, police chinoise servie à part)
        id: g_e6
        continue-on-error: true
        env:
          DIR: ${{ steps.unpacked.outputs.dir }}
        run: |
          set -euo pipefail
          have="$(git -C evo-fonts rev-parse HEAD)"
          [ "$have" = "$EVO_FONTS_REV" ] || { echo "::error::evo-fonts à $have, épinglé à $EVO_FONTS_REV"; exit 1; }
          # la face chinoise du manifeste de evo-fonts (même lecture que xtask/src/web.rs)
          line="$(awk -F'|' '{ for (i = 1; i <= NF; i++) gsub(/^ +| +$/, "", $i) } $1 == "Noto Sans CJK SC" && $2 == "Regular" { print $3 "|" $6 "|" $7; exit }' evo-fonts/fonts/manifest.txt)"
          [ -n "$line" ] || { echo "::error::Noto Sans CJK SC Regular absente du manifeste de evo-fonts"; exit 1; }
          IFS='|' read -r font_path lic_path pinned <<< "$line"
          src="evo-fonts/$font_path"; lic="evo-fonts/$lic_path"
          served="$DIR/evolight_zh_hans.otf"
          [ -f "$served" ] || { echo "::error::police chinoise absente de l'archive"; exit 1; }
          a="$(sha256sum "$src" | cut -d' ' -f1)"; b="$(sha256sum "$served" | cut -d' ' -f1)"
          [ "$a" = "$b" ] || { echo "::error::evolight_zh_hans.otf ($b) diffère de la face de evo-fonts ($a)"; exit 1; }
          [ "$b" = "$pinned" ] || { echo "::error::evolight_zh_hans.otf ($b) diffère de l'empreinte du manifeste ($pinned)"; exit 1; }
          cmp -s "$lic" "$DIR/OFL-noto-sans-cjk-sc.txt" || { echo "::error::licence OFL de la police chinoise absente ou différente"; exit 1; }
          # EVORA-REV-66 : licence OFL d'Inter (police embarquée dans le .wasm), identique à celle de l'arbre
          cmp -s assets/fonts/OFL-Inter.txt "$DIR/LICENSES/OFL-Inter.txt" || { echo "::error::licence OFL d'Inter absente de LICENSES/ ou différente de assets/fonts/OFL-Inter.txt"; exit 1; }
          inter_ofl="$(sha256sum "$DIR/LICENSES/OFL-Inter.txt" | cut -d' ' -f1)"
          n_ofl="$(find "$DIR/LICENSES" -name 'OFL-*.txt' | wc -l)"
          wasm="$(stat -c %s "$DIR/evolight_web_bg.wasm")"; font="$(stat -c %s "$served")"
          {
            echo "### Porte E6 : polices"
            echo
            echo "- evo-fonts : $have (épinglé)"
            echo "- police chinoise servie à part : evolight_zh_hans.otf, $font o, sha256 $b, identique à $font_path de evo-fonts et à l'empreinte de son manifeste"
            echo "- licence : OFL-noto-sans-cjk-sc.txt identique à $lic_path ; $n_ofl fichiers OFL dans LICENSES/"
            echo "- Inter : LICENSES/OFL-Inter.txt identique à assets/fonts/OFL-Inter.txt (sha256 $inter_ofl)"
            echo "- module wasm (Inter, police japonaise BIZ UDPGothic, polices thaïe Noto Sans Thai et géorgienne Noto Sans Georgian embarquées) : $wasm o"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test de fumée — sabotage CSP (doit échouer)
        id: g_smoke_sabotage
        continue-on-error: true
        run: |
          set +e   # l'échec attendu du sabotage ne doit pas interrompre l'étape
          set -uo pipefail
          node .github/evora/smoke.mjs --site "${{ steps.unpacked.outputs.dir }}" --out "$RUNNER_TEMP/evora-diag/sabotage" \
            --timeout 60 --scenario 'sabotage-csp||' --sabotage-csp
          code=$?
          if [ "$code" -eq 0 ]; then echo "::error::le test de fumée n'a pas rougi sous sabotage CSP : instrument aveugle"; exit 1; fi
          echo "Sabotage CSP : le test de fumée a bien échoué (code $code)."

      - name: Porte test de fumée — Chrome sans interface, iframe d'une autre origine, audit de rendu E10 et E9, pont EHP, témoin RAW
        id: g_smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/evora"
          node .github/evora/smoke.mjs --site "${{ steps.unpacked.outputs.dir }}" --out "$RUNNER_TEMP/evora-diag/smoke" --timeout 150 \
            --render-audit --terms-blocking --repo "$GITHUB_WORKSPACE" --commands-out "$OUT/commands.json" \
            --command-params-out "$OUT/command-params.json" \
            | tee "$RUNNER_TEMP/evora-diag/smoke.txt"
          # EVORA-REV-34 : commands.json de l'artefact (catalogue de command.catalog jugé par « pont-ehp »),
          # que le provisionnement d'Evora copie dans engines.json ; son empreinte rejoint SHA256SUMS.
          if [ ! -s "$OUT/commands.json" ]; then echo "::error::commands.json absent : aucun catalogue reçu par « pont-ehp »"; exit 1; fi
          (cd "$OUT" && sha256sum commands.json >> SHA256SUMS)
          cp "$OUT/commands.json" "$RUNNER_TEMP/evora-diag/commands.json"
          # EVORA-REV-38 : command-params.json de l'artefact (schémas des paramètres déclarés, sous la forme des
          # commandes d'engines.json, jugés par « pont-ehp ») ; son empreinte rejoint SHA256SUMS.
          if [ ! -s "$OUT/command-params.json" ]; then echo "::error::command-params.json absent : aucun schéma reçu par « pont-ehp »"; exit 1; fi
          (cd "$OUT" && sha256sum command-params.json >> SHA256SUMS)
          cp "$OUT/command-params.json" "$RUNNER_TEMP/evora-diag/command-params.json"

      - name: Témoins du pont EHP et du témoin RAW — moteurs factices et vrai moteur sabordés (chaque défaut doit rougir, le conforme rester vert)
        id: g_ehp_witness
        if: ${{ !cancelled() && steps.unpacked.outcome == 'success' }}
        run: |
          set -euo pipefail
          node .github/evora/smoke.mjs --site "${{ steps.unpacked.outputs.dir }}" --out "$RUNNER_TEMP/evora-diag/ehp-witness" --ehp-witness \
            | tee "$RUNNER_TEMP/evora-diag/ehp-witness.txt"

      - name: Verdict des portes
        if: ${{ !cancelled() }}
        env:
          EMOJI: ${{ steps.g_emoji.outcome }}
          DENY: ${{ steps.g_deny.outcome }}
          E7: ${{ steps.g_e7.outcome }}
          CLOCK: ${{ steps.g_clock.outcome }}
          FROZEN: ${{ steps.g_frozen.outcome }}
          TESTS: ${{ steps.g_tests.outcome }}
          E6: ${{ steps.g_e6.outcome }}
          ABOUT: ${{ steps.g_about.outcome }}
          BUNDLE: ${{ steps.g_bundle.outcome }}
          TERM: ${{ steps.g_term.outcome }}
          SABOTAGE: ${{ steps.g_smoke_sabotage.outcome }}
          SMOKE: ${{ steps.g_smoke.outcome }}
          WITNESS: ${{ steps.g_ehp_witness.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Verdict des portes"
            echo
            echo "| Porte | Résultat |"
            echo "|---|---|"
            echo "| E10 émojis et E9 termes sensibles (catalogues affichés, code d'interface) | $EMOJI |"
            echo "| cargo-deny (licences, avis, sources) | $DENY |"
            echo "| E7 neutralisations du graphe web | $E7 |"
            echo "| Horloge (aucune lecture d'horloge de std sans garde dans le build web, L4-REV-H) | $CLOCK |"
            echo "| Empreintes figées des rendus V1 à V6 (lot 1, P0 ; relevé sur un arbre sans Evora1, contrôle ensuite) | $FROZEN |"
            echo "| Tests Rust (schéma des réglages, pipeline, catalogue, modules WGSL, accord des deux chemins sur lavapipe ; provenance de R11 ; liste fermée, aucun saut) | $TESTS |"
            echo "| E6 polices (evo-fonts épinglé, police chinoise à part) | $E6 |"
            echo "| cargo-about (LICENSES/ des crates) | $ABOUT |"
            echo "| Bundle (marques, hébergement, .gz/.br, CSP, taille) | $BUNDLE |"
            echo "| Zéro terme (nom amont retiré absent du site, hors LICENSES/) | $TERM |"
            echo "| Sabotage CSP du test de fumée (doit rougir) | $SABOTAGE |"
            echo "| Test de fumée (autre origine, démarrage à froid, audit de rendu E10 et E9, pont EHP E4/E5, témoin RAW) | $SMOKE |"
            echo "| Témoins du pont EHP et du témoin RAW (moteurs factices et vrai moteur sabordés : conforme vert, chaque défaut rouge) | $WITNESS |"
            echo
            echo "Avertissements de cargo-deny : $(awk '/^warning/ { n++ } END { print n + 0 }' "$RUNNER_TEMP/cargo-deny.txt" 2>/dev/null || echo '?') (détail dans le journal de la porte)."
          } >> "$GITHUB_STEP_SUMMARY"
          for v in "$EMOJI" "$DENY" "$E7" "$CLOCK" "$FROZEN" "$TESTS" "$E6" "$ABOUT" "$BUNDLE" "$TERM" "$SABOTAGE" "$SMOKE" "$WITNESS"; do
            if [ "$v" != "success" ]; then echo "::error::au moins une porte est rouge : voir le résumé du job"; exit 1; fi
          done
          echo "Toutes les portes sont vertes."

      - name: Dépôt de l'artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/evora/
          if-no-files-found: error

      - name: Dépôt des diagnostics (captures du test de fumée, rapports)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evora-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evora-diag/
            ${{ runner.temp }}/cargo-deny.txt
            ${{ runner.temp }}/cargo-about.txt
          if-no-files-found: warn
          retention-days: 30
