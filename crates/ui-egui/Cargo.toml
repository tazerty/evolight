[package]
name = "evolight-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EvoLight egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
evo-ui = { workspace = true }
evo-window = { workspace = true }
evolight-geom = { workspace = true }
evolight-meta = { workspace = true }
evolight-color = { workspace = true }
evolight-raster = { workspace = true }
evolight-develop = { workspace = true }
evolight-pipeline = { workspace = true }
evolight-catalog = { workspace = true }
web-time = { workspace = true }
evolight-engine = { workspace = true }
evolight-slideshow = { workspace = true }
evolight-preview = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
evolight-testkit = { workspace = true }
# The model-setup tests install and resume a real denoise model. Without this the engine's
# `default_loader` is the "this build cannot run denoise models" stub when the package is tested
# on its own (`cargo test -p evolight-ui-egui`); a workspace test only passed by feature
# unification with the desktop app's default `denoise` feature.
evolight-engine = { workspace = true, features = ["denoise"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
evolight-denoise = { workspace = true, features = ["runtime"] }
evolight-codecs = { workspace = true }
evolight-faces = { workspace = true }
evolight-merge = { workspace = true }
# a device for the GPU-resident view test (`render.rs`)
pollster = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
evo-update = { workspace = true }
