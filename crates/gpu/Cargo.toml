[package]
name = "evolight-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoLight GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
evolight-denoise = { workspace = true, optional = true }
evolight-geom = { workspace = true }
evolight-color = { workspace = true }
evolight-raster = { workspace = true }
evolight-develop = { workspace = true }
evolight-faces = { workspace = true }
evolight-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:evolight-denoise", "evolight-denoise/runtime"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
evolight-testkit = { workspace = true }
evolight-scenes = { workspace = true }
evolight-raw = { workspace = true }
