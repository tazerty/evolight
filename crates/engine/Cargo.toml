[package]
name = "evolight-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EvoLight engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
evo-docpath = { workspace = true }
evolight-geom = { workspace = true }
evolight-color = { workspace = true }
evolight-raster = { workspace = true }
evolight-develop = { workspace = true }
evolight-scenes = { workspace = true }
evolight-pipeline = { workspace = true }
evolight-gpu = { workspace = true }
evolight-catalog = { workspace = true }
web-time = { workspace = true }
evolight-preview = { workspace = true }
evolight-codecs = { workspace = true }
evolight-raw = { workspace = true }
evolight-denoise-core = { workspace = true }
evolight-denoise = { workspace = true, optional = true }
evolight-meta = { workspace = true }
evolight-lensdb = { workspace = true }
evolight-faces = { workspace = true }
miniz_oxide = { workspace = true }
evolight-merge = { workspace = true }
evolight-geocode = { workspace = true }
evolight-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.13", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
evolight-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
evolight-fetch = { workspace = true }
# capture-time parsing for face recognition (native only)
chrono = { workspace = true }
# free space of the drive holding the preview cache (the low-disk alert; pure Rust: rustix / windows-sys)
fs4 = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:evolight-segment"]
denoise = ["dep:evolight-denoise", "evolight-denoise/runtime", "evolight-gpu/denoise"]
rawnind-model = ["denoise", "evolight-denoise/rawnind-model", "evolight-denoise-core/rawnind-model"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
evolight-testkit = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
evolight-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
evolight-tiff = { workspace = true }
