[package]
name = "evolight"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "evolight"

[lints]
workspace = true

[features]
default = ["denoise"]
denoise = ["evolight-engine/denoise"]
rawnind-model = ["denoise", "evolight-engine/rawnind-model"]
# Open HEIC/HEIF photos (the optional evolight-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it.
heif = ["evolight-codecs/heif"]

[dependencies]
evolight-engine = { workspace = true, features = ["sam"] }
evolight-sysmem = { workspace = true }
evolight-ui-egui = { workspace = true }
evolight-codecs = { workspace = true }
evolight-raster = { workspace = true }
# `clipboard` is a separate eframe feature in 0.37: without it egui-winit simulates an in-process
# clipboard and cut/copy/paste, RequestPaste and the Wayland PRIMARY path are unavailable.
eframe = { workspace = true, features = ["default_fonts", "clipboard", "wgpu", "glow", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# probing the window's renderer before it opens (`window_gpu`)
pollster = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for evolight.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
evolight-testkit = { workspace = true }

[target.'cfg(windows)'.dependencies]
evo-update = { workspace = true }
# the colour profile of the monitor showing the window (`win_screen_profile`)
evolight-wincolor = { workspace = true }
raw-window-handle = "0.6"
